[project]
name = "ba-jira-agent"
version = "0.1.0"
description = "AI backlog analysis agent with grounded Jira tools, metrics, and risk flags."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Touseef Shaik" }]
dynamic = ["dependencies"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
follow_imports = "skip"
ignore_missing_imports = true
warn_unused_ignores = true
